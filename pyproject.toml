[project]
name = "enterprise-ai-knowledge-copilot"
version = "0.1.0"
description = "Plateforme IA d'entreprise pour interroger la documentation interne"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]